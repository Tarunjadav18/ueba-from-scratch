services:
  - type: web
    name: ueba-console
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    numInstances: 1
    envVars:
      - key: UEBA_DATA_DIR
        value: /var/data
      - key: UEBA_BIND_ADDRESS
        value: 0.0.0.0
